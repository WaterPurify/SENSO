[project]
name = "senso"
version = "0.10.1"
description = "SENSO - Sen & So와 함께 찾는 나만의 커피·차 한 잔"
requires-python = ">=3.12"
dependencies = [
    "flet==1.1.2",
    "pillow>=13.0",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.flet]
org = "com.senso"
product = "SENSO"
company = "SENSO"

[tool.flet.app]
path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# 화면에 그대로 보여 줄 한국어 문장은 줄을 나누지 않는다
"src/senso/recommend/engine.py" = ["E501"]
"src/senso/characters/*.py" = ["E501"]
"src/senso/taste/quiz.py" = ["E501"]
"src/senso/origin.py" = ["E501"]
"src/senso/domain/tea.py" = ["E501"]
"src/senso/shop.py" = ["E501"]
"src/senso/art.py" = ["E501"]
"src/senso/ui/views/shop_view.py" = ["E501"]
"src/senso/domain/aroma.py" = ["E501"]
"src/senso/word/*.py" = ["E501"]
"src/senso/ui/views/word_view.py" = ["E501"]
